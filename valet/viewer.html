<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>valet</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e3e3de;
  --accent: #2f5bd3; --ok: #1f8a4c; --bad: #c2372b; --run: #b7791f;
  --add-bg: #e6f4ea; --add: #1a6e3a; --del-bg: #fbe9e7; --del: #a02a1f; --hunk: #6a55b8;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161615; --panel: #1f1f1d; --ink: #e8e8e3; --muted: #9a9a93; --line: #33332f;
    --accent: #7c9cff; --ok: #4cc27f; --bad: #ff7b6e; --run: #e6b450;
    --add-bg: #1d3325; --add: #8fe0a9; --del-bg: #3a2220; --del: #ffaaa1; --hunk: #b9a6ff;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; height: 100vh;
  display: grid; grid-template-rows: auto 1fr; }
header { display: flex; gap: 12px; align-items: center; padding: 10px 16px;
  border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
header h1 { font-size: 15px; margin: 0; letter-spacing: .02em; }
#note-form { flex: 1; display: flex; gap: 8px; min-width: 260px; }
#note { flex: 1; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--bg); color: var(--ink); font: inherit; }
button { padding: 7px 12px; border-radius: 6px; border: 1px solid var(--accent);
  background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
button.ghost { background: transparent; color: var(--accent); }
#pending { display: flex; gap: 6px; flex-wrap: wrap; width: 100%; }
#pending:empty { display: none; }
.chip { font-size: 12px; padding: 3px 8px; border-radius: 999px; background: var(--bg);
  border: 1px dashed var(--run); color: var(--ink); }
.chip b { cursor: pointer; margin-left: 6px; color: var(--muted); }
main { display: grid; grid-template-columns: minmax(220px, 320px) minmax(0, 1fr); min-height: 0; }
#runs { overflow: auto; border-right: 1px solid var(--line); background: var(--panel); }
.run { padding: 8px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
.run:hover { background: var(--bg); }
.run.sel { background: var(--bg); box-shadow: inset 3px 0 0 var(--accent); }
.run .top { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.run .cmd { font-family: var(--mono); font-size: 12px; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
.dot.run { background: var(--run); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
#detail { overflow: auto; padding: 16px 20px; min-width: 0; }
.empty { color: var(--muted); padding: 40px; text-align: center; }
.meta { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
.cmdline { font-family: var(--mono); background: var(--panel); border: 1px solid var(--line);
  padding: 8px 10px; border-radius: 6px; overflow-x: auto; white-space: pre; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted);
  margin: 20px 0 6px; display: flex; gap: 8px; align-items: center; }
h2 .path { text-transform: none; letter-spacing: 0; font-family: var(--mono); color: var(--ink); }
.tabs { display: flex; gap: 4px; flex-shrink: 0; margin-left: auto; }
.tabs button { padding: 2px 8px; font-size: 11px; }
h2 .path { overflow-wrap: anywhere; }
.filebar { display: flex; gap: 10px; align-items: center; font-size: 12px; color: var(--muted); margin: 18px 0 -8px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 3px 10px; font-size: 12px; background: transparent; color: var(--muted); }
.seg button.on { background: var(--accent); color: #fff; }
.filebar label { display: inline-flex; gap: 4px; align-items: center; cursor: pointer; }
.fhead { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 20px 0 6px; }
.fhead .fname { font-family: var(--mono); font-weight: 600; font-size: 13px; overflow-wrap: anywhere; }
.fhead .ver { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.fhead .counts { font-family: var(--mono); font-size: 12px; }
.fhead .counts .a { color: var(--ok); } .fhead .counts .d { color: var(--bad); }
.fhead .tabs { margin-left: auto; }
.filemount { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; min-height: 20px; }
.unchanged { padding: 8px 12px; font-size: 12.5px; color: var(--muted); background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px 6px 0 0; border-bottom: 0; }
.unchanged + .filemount { border-top-left-radius: 0; border-top-right-radius: 0; }
pre.code { margin: 0; font-family: var(--mono); font-size: 12.5px; background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px; padding: 10px; overflow: auto; max-height: 60vh; }
pre.code span { display: block; }
.add { background: var(--add-bg); color: var(--add); }
.del { background: var(--del-bg); color: var(--del); }
.hunk { color: var(--hunk); }
.trail { display: grid; gap: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
.trail-sum { font-size: 12px; color: var(--muted); padding: 8px 12px; border-bottom: 1px solid var(--line); }
.trail-sum b { color: var(--ink); font-family: var(--mono); font-weight: 600; }
.step { display: grid; grid-template-columns: 140px 1fr auto; gap: 4px 12px; padding: 9px 12px;
  border-bottom: 1px solid var(--line); align-items: baseline; }
.step:last-child { border-bottom: 0; }
.op { font-family: var(--mono); font-size: 11.5px; padding: 1px 7px; border-radius: 4px; justify-self: start;
  background: var(--bg); border: 1px solid var(--line); white-space: nowrap; }
.op.k-reduce { color: var(--bad); } .op.k-combine { color: var(--accent); }
.op.k-agg { color: var(--hunk); } .op.k-io { color: var(--muted); }
.step .why { grid-column: 2; }
.step .code-line { grid-column: 2; font-family: var(--mono); font-size: 12px; color: var(--muted);
  overflow-wrap: anywhere; }
.step .loc { grid-column: 3; grid-row: 1; font-size: 11.5px; color: var(--muted); font-family: var(--mono); }
.step .shapes { grid-column: 2; font-family: var(--mono); font-size: 12.5px; }
.delta { margin-left: 8px; font-size: 12px; }
.delta.down { color: var(--bad); } .delta.up { color: var(--accent); }
.colchip { font-family: var(--mono); font-size: 11px; padding: 0 5px; border-radius: 3px; margin: 0 3px 0 0; }
.colchip.add { background: var(--add-bg); color: var(--add); } .colchip.rm { background: var(--del-bg); color: var(--del); }
.step .warn { grid-column: 2 / 4; background: var(--del-bg); color: var(--del); border-radius: 4px;
  padding: 4px 8px; font-size: 12.5px; }
.badge-warn { font-size: 11px; color: var(--bad); margin-left: 6px; }
@media (max-width: 700px) { .step { grid-template-columns: 1fr; } .step > * { grid-column: 1 !important; grid-row: auto !important; } }
.tree { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
.tree svg.edges { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
.tnode { position: relative; padding: 8px 12px 8px var(--gutter); border-bottom: 1px solid var(--line); cursor: pointer; }
.tnode:last-child { border-bottom: 0; }
.tnode:hover { background: var(--bg); }
.tnode.minor { padding-top: 3px; padding-bottom: 3px; font-size: 12px; color: var(--muted); }
.gdot { position: absolute; top: 14px; width: 11px; height: 11px; margin-left: -5.5px; border-radius: 50%;
  background: var(--lane); border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--lane); z-index: 1; }
.tnode.minor .gdot { top: 9px; width: 7px; height: 7px; margin-left: -3.5px; }
.tnode.source .gdot { background: var(--panel); border-color: var(--lane); box-shadow: none; }
.tnode.sink .gdot { border-radius: 2px; }
.tnode.warned .gdot { --lane: var(--bad); }
.thead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.thead .label { font-family: var(--mono); font-weight: 600; font-size: 13px; }
.thead .ver { font-family: var(--mono); font-size: 10.5px; color: var(--muted); margin-left: -7px; }
.thead .loc { margin-left: auto; font-size: 11.5px; color: var(--muted); font-family: var(--mono); }
.tnode .why { margin-top: 2px; }
.tnode .code-line { font-family: var(--mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; margin-top: 2px; }
.tnode .warn { margin-top: 4px; background: var(--del-bg); color: var(--del); border-radius: 4px; padding: 4px 8px; font-size: 12.5px; }
.preview { margin-top: 8px; overflow-x: auto; cursor: auto; border: 1px solid var(--line); border-radius: 4px; }
.preview table { border-collapse: collapse; font-family: var(--mono); font-size: 12px; min-width: 100%; }
.preview th, .preview td { padding: 3px 10px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--line); }
.preview th { background: var(--bg); position: sticky; top: 0; font-weight: 600; }
.preview th.new { color: var(--add); }
.preview .dtype { font-weight: 400; color: var(--muted); font-size: 11px; }
.preview .nullbar { height: 3px; background: var(--line); border-radius: 2px; margin-top: 3px; }
.preview .nullbar i { display: block; height: 100%; background: var(--bad); border-radius: 2px; }
.preview .nulltxt { font-weight: 400; font-size: 10.5px; color: var(--muted); }
.legend { font-size: 11.5px; color: var(--muted); }
.run .title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.run .title + .cmd { color: var(--muted); font-size: 11px; }
.badge-out { font-size: 11px; color: var(--muted); margin-left: 6px; }
.run-title { font-size: 17px; font-weight: 650; margin: 0 0 4px; overflow-wrap: anywhere; }
.art { border: 1px solid var(--line); border-radius: 6px; background: var(--panel); margin-bottom: 12px; overflow: hidden; }
.art-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.art-kind { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.art-name { font-family: var(--mono); font-weight: 600; font-size: 13px; overflow-wrap: anywhere; }
.art-shape { font-family: var(--mono); font-size: 12.5px; }
.art-meta { font-size: 12px; color: var(--muted); }
.art-cmp { font-size: 12px; } .art-cmp .up { color: var(--accent); } .art-cmp .down { color: var(--bad); }
.art-head .loc { margin-left: auto; font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.art-tools { display: flex; gap: 10px; align-items: center; padding: 6px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.art-tools input[type=search] { padding: 4px 8px; border: 1px solid var(--line); border-radius: 5px; background: var(--bg);
  color: var(--ink); font: inherit; font-size: 12.5px; min-width: 0; width: 220px; max-width: 100%; }
.art-tools .meta { margin: 0; }
.grid { max-height: 420px; overflow: auto; }
.grid table { border-collapse: collapse; font-family: var(--mono); font-size: 12px; min-width: 100%; }
.grid th, .grid td { padding: 3px 10px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--line); }
.grid thead th { position: sticky; top: 0; background: var(--bg); font-weight: 600; cursor: pointer; user-select: none; z-index: 1; }
.grid thead th:hover { color: var(--accent); }
.grid th .dtype { font-weight: 400; color: var(--muted); font-size: 11px; }
.grid th .nulltxt { font-weight: 400; font-size: 10.5px; color: var(--muted); }
.grid th .nullbar { height: 3px; background: var(--line); border-radius: 2px; margin-top: 3px; }
.grid th .nullbar i { display: block; height: 100%; background: var(--bad); border-radius: 2px; }
.grid td.rn, .grid th.rn { color: var(--muted); text-align: right; cursor: default; }
.grid td.num { text-align: right; }
.grid tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--bg) 50%, transparent); }
.chartbox { padding: 10px 12px; min-height: 120px; }
.chartbox .vega-embed { width: 100%; }
.art iframe { display: block; width: 100%; height: 480px; border: 0; background: #fff; }
.art-head a { font-size: 12px; color: var(--accent); }
.art img { display: block; max-width: 100%; height: auto; margin: 0 auto; background: #fff; }
.art .err { padding: 8px 12px; color: var(--bad); font-size: 12.5px; }
.errcard { border: 1px solid var(--bad); border-left-width: 4px; border-radius: 6px; background: var(--panel);
  margin: 14px 0 4px; padding: 10px 14px; }
.errcard .etype { font-family: var(--mono); font-weight: 700; color: var(--bad); }
.errcard .emsg { font-family: var(--mono); font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; margin: 4px 0; }
.errcard .eloc { font-size: 12px; color: var(--muted); margin-top: 6px; }
.errcard .eloc b { font-family: var(--mono); color: var(--ink); font-weight: 600; }
.errcard pre.ectx { margin: 6px 0 0; font-family: var(--mono); font-size: 12.5px; background: var(--bg);
  border-radius: 4px; padding: 6px 0; overflow-x: auto; }
.errcard pre.ectx span { display: block; padding: 0 10px; }
.errcard pre.ectx .hit { background: var(--del-bg); color: var(--del); font-weight: 600; }
.errcard pre.ectx .ln { color: var(--muted); display: inline-block; min-width: 3.5em; }
.errcard .hint { font-size: 12.5px; margin-top: 8px; }
.errcard details { margin-top: 8px; font-size: 12px; }
.errcard details pre { font-family: var(--mono); font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere;
  background: var(--bg); padding: 8px 10px; border-radius: 4px; max-height: 320px; overflow: auto; }
.run .etag { color: var(--bad); font-size: 11px; margin-left: 6px; font-family: var(--mono); }
.grid th .prof { font-weight: 400; font-size: 10.5px; color: var(--muted); margin-top: 5px; min-width: 110px; }
.grid th .prof svg { display: block; }
.grid th .prof .topv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 6px; align-items: center; }
.grid th .prof .topv span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 110px; }
.grid th .prof .bar { height: 3px; background: var(--accent); border-radius: 2px; grid-column: 1 / 3; margin-bottom: 2px; opacity: .7; }
.art.noprof .prof { display: none; }
.rowdiff { border-bottom: 1px solid var(--line); padding: 6px 12px; font-size: 12.5px; }
.rowdiff summary { cursor: pointer; color: var(--muted); }
.rowdiff .chips { margin: 6px 0; display: flex; flex-wrap: wrap; gap: 4px; }
.rowdiff .chip2 { font-family: var(--mono); font-size: 11px; padding: 1px 6px; border-radius: 3px; background: var(--bg); border: 1px solid var(--line); }
.rowdiff table { border-collapse: collapse; font-family: var(--mono); font-size: 12px; margin-top: 4px; }
.rowdiff td { padding: 2px 10px 2px 0; vertical-align: top; white-space: nowrap; }
.rowdiff .k-added { color: var(--add); } .rowdiff .k-removed { color: var(--del); } .rowdiff .k-changed { color: var(--hunk); }
.rowdiff .old { color: var(--del); text-decoration: line-through; } .rowdiff .new { color: var(--add); }
.rowdiff .scroll { max-height: 300px; overflow: auto; }
.art-tools label { font-size: 12px; color: var(--muted); display: inline-flex; gap: 4px; align-items: center; cursor: pointer; }
#asks { width: 100%; display: grid; gap: 8px; }
#asks:empty { display: none; }
.ask { border: 2px solid var(--accent); border-radius: 8px; padding: 10px 14px; background: var(--bg);
  display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; animation: askin .25s ease-out; }
@keyframes askin { from { transform: translateY(-4px); opacity: 0; } }
.ask .q { font-weight: 650; font-size: 15px; flex: 1 1 280px; }
.ask .q small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); margin-top: 2px; }
.ask .choices { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.ask .choices input { padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel);
  color: var(--ink); font: inherit; min-width: 220px; }
.ask .choices button.def { background: transparent; color: var(--accent); }
.ask .left { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.art .answer { padding: 8px 12px; font-size: 13px; }
.art .answer b { font-family: var(--mono); }
.note-delivered { border-left: 3px solid var(--run); padding: 6px 10px; background: var(--panel);
  margin-top: 6px; border-radius: 0 6px 6px 0; }
label.follow { font-size: 12px; color: var(--muted); display: flex; gap: 4px; align-items: center; }
@media (max-width: 700px) {
  main { grid-template-columns: minmax(0, 1fr); grid-template-rows: 35vh 1fr; }
  #runs { border-right: 0; border-bottom: 1px solid var(--line); }
}
</style>
</head>
<body>
<header>
  <h1>valet</h1>
  <form id="note-form">
    <input id="note" placeholder="Message the agent; it sees this at the end of its next run" autocomplete="off">
    <button>Send</button>
  </form>
  <label class="follow"><input type="checkbox" id="follow" checked> follow latest</label>
  <span id="conn" class="badge-warn"></span>
  <div id="pending"></div>
  <div id="asks" aria-live="polite"></div>
</header>
<main>
  <nav id="runs"></nav>
  <section id="detail"><div class="empty">No runs yet. Have the agent run something with <code>valet py</code>.</div></section>
</main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let selected = null, lastDetailKey = "", fileView = {};

function status(r) { return r.exit_code === null ? "run" : (r.exit_code === 0 ? "ok" : "bad"); }
function ago(ts) { return new Date(ts * 1000).toLocaleTimeString(); }
// Paths may be POSIX or Windows (C:\...). Show them relative to the run's folder, with "/".
function relPath(p, cwd) {
  if (!p) return "";
  const P = p.replace(/\\/g, "/"), C = (cwd || "").replace(/\\/g, "/").replace(/\/$/, "");
  const win = /^[a-z]:\//i.test(P);
  const under = C && (win ? P.toLowerCase().startsWith(C.toLowerCase() + "/") : P.startsWith(C + "/"));
  return under ? P.slice(C.length + 1) : P;
}
// "C:\...\uv.EXE run python C:\proj\.valet\scratch\snippet-1.py" -> "snippet-1.py"
function shortCmd(argv, cwd) {
  const base = (x) => x.split(/[\\/]/).pop().toLowerCase().replace(/\.exe$/, "");
  let a = argv.slice();
  if (a.length && base(a[0]) === "uv") {
    a = a.slice(1);
    if (a[0] === "run") a = a.slice(1);
    while (a.length && a[0].startsWith("--")) a = a.slice(1);
  }
  if (a.length > 1 && /^(python[\d.]*|pypy[\d.]*|py)$/.test(base(a[0]))) a = a.slice(1);
  return a.map((x) => /[\\/]\.valet[\\/]scratch[\\/]/.test(x) ? x.split(/[\\/]/).pop() : relPath(x, cwd)).join(" ");
}

function renderDiff(diff) {
  return diff.split("\n").map((l) => {
    const cls = l.startsWith("@@") ? "hunk" : (l.startsWith("+") && !l.startsWith("+++")) ? "add"
      : (l.startsWith("-") && !l.startsWith("---")) ? "del" : "";
    return `<span class="${cls}">${esc(l) || " "}</span>`;
  }).join("");
}


const fmtShape = (sh) => sh ? sh.map((n) => n.toLocaleString()).join(" × ") : "?";
function opKind(op) {
  if (op.startsWith("read:") || op.startsWith("write:")) return "k-io";
  if (/filter|drop_duplicates|dropna|drop_nulls|unique|query|^drop$/.test(op)) return "k-reduce";
  if (/merge|join|concat|vstack|hstack/.test(op)) return "k-combine";
  if (/^group_?by|pivot|melt|unpivot|collect/.test(op)) return "k-agg";
  return "";
}
function renderStep(st) {
  const ins = st.inputs || [];
  const rin = ins[0] && ins[0].shape ? ins[0].shape[0] : null;
  const rout = st.output ? st.output[0] : null;
  let delta = "";
  if (rin !== null && rout !== null && rin !== rout) {
    const d = rout - rin, pct = rin ? Math.abs(100 * d / rin).toFixed(1) : "∞";
    delta = `<span class="delta ${d < 0 ? "down" : "up"}">${d > 0 ? "+" : "−"}${Math.abs(d).toLocaleString()} rows (${pct}%)</span>`;
  }
  const shapes = ins.length ? ins.map((i) => fmtShape(i.shape)).join(" + ") + " → " + fmtShape(st.output) : fmtShape(st.output);
  const params = Object.entries(st.params || {}).map(([k, v]) => `${k}=${v}`).join(", ");
  const cols = [
    ...(st.cols_added || []).map((c) => `<span class="colchip add">+${esc(c)}</span>`),
    ...(st.cols_removed || []).map((c) => `<span class="colchip rm">−${esc(c)}</span>`),
  ].join("");
  const site = st.site || {};
  return `<div class="step">
    <span class="op ${opKind(st.op)}" title="${esc(params)}">${esc(st.op)}</span>
    ${site.comment ? `<div class="why">${esc(site.comment)}</div>` : ""}
    <span class="loc">${site.file ? esc(site.file.split(/[\\/]/).pop() + ":" + site.line) : ""}</span>
    <div class="code-line">${esc(site.code || params)}</div>
    <div class="shapes">${shapes}${delta}${cols ? " &nbsp;" + cols : ""}</div>
    ${(st.warnings || []).map((w) => `<div class="warn">⚠ ${esc(w)}</div>`).join("")}
  </div>`;
}

// ---- transformation tree ---------------------------------------------------------------
const LANES = ["var(--accent)", "var(--hunk)", "var(--ok)", "var(--run)", "var(--bad)"];
let openNodes = new Set();

function layoutTree(trail) {
  const rows = trail.filter((s) => s.out_node != null);
  const pos = {}, lanes = [];
  rows.forEach((s, i) => {
    const parents = (s.in_nodes || []).filter((p) => pos[p]);
    let lane = -1;
    if (parents.length && lanes[pos[parents[0]].lane] === parents[0]) lane = pos[parents[0]].lane;
    if (lane < 0) { lane = lanes.indexOf(null); if (lane < 0) { lane = lanes.length; lanes.push(null); } }
    parents.slice(1).forEach((p) => { const l = pos[p].lane; if (lanes[l] === p) lanes[l] = null; });
    lanes[lane] = s.node && s.node.sink ? null : s.out_node;
    pos[s.out_node] = { lane, row: i };
  });
  return { rows, pos, width: Math.max(1, lanes.length) };
}

function deltaHtml(st) {
  const ins = st.inputs || [];
  const rin = ins[0] && ins[0].shape ? ins[0].shape[0] : null, rout = st.output ? st.output[0] : null;
  if (rin === null || rout === null || rin === rout) return "";
  const d = rout - rin, pct = rin ? Math.abs(100 * d / rin).toFixed(1) : "∞";
  return `<span class="delta ${d < 0 ? "down" : "up"}">${d > 0 ? "+" : "−"}${Math.abs(d).toLocaleString()} rows (${pct}%)</span>`;
}

function previewHtml(st) {
  const p = st.node && st.node.profile;
  if (!p) return `<div class="preview meta" style="padding:8px">${st.node && st.node.sink ? "written to " + esc(st.node.label) : "no preview recorded"}</div>`;
  const added = new Set(st.cols_added || []);
  const rows = st.output ? st.output[0] : 0;
  const head = p.columns.map((c, i) => {
    const nulls = p.nulls ? p.nulls[i] : null, pct = nulls !== null && rows ? 100 * nulls / rows : 0;
    const nullInfo = nulls === null ? "" : `<div class="nulltxt">${nulls ? pct.toFixed(1) + "% missing" : "no missing"}</div>
      <div class="nullbar"><i style="width:${Math.min(100, pct)}%"></i></div>`;
    return `<th class="${added.has(c) ? "new" : ""}">${esc(c)} <span class="dtype">${esc(p.dtypes[i])}</span>${nullInfo}</th>`;
  }).join("");
  const body = p.sample.map((r) => `<tr>${r.map((v) => `<td>${esc(v)}</td>`).join("")}</tr>`).join("");
  const more = p.more_columns ? `<div class="meta" style="padding:4px 10px">+${p.more_columns} more columns</div>` : "";
  return `<div class="preview"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>${more}</div>`;
}

function renderTree(trail, runId) {
  const { rows, pos, width } = layoutTree(trail);
  const gutter = 14 + width * 16;
  const counts = {}, seen = {};
  rows.forEach((s) => { const l = s.node.label; counts[l] = (counts[l] || 0) + 1; });
  const html = rows.map((st) => {
    const n = st.node, l = n.label, lane = pos[st.out_node].lane;
    seen[l] = (seen[l] || 0) + 1;
    const ver = counts[l] > 1 && !n.sink ? `<span class="ver">v${seen[l]}</span>` : "";
    const site = st.site || {};
    const kind = st.op === "source" ? "source" : n.sink ? "sink" : st.minor ? "minor" : "";
    const params = Object.entries(st.params || {}).map(([k, v]) => `${k}=${v}`).join(", ");
    const cols = [...(st.cols_added || []).map((c) => `<span class="colchip add">+${esc(c)}</span>`),
                  ...(st.cols_removed || []).map((c) => `<span class="colchip rm">−${esc(c)}</span>`)].join("");
    const key = runId + ":" + st.out_node;
    const warned = (st.warnings || []).length ? "warned" : "";
    const shape = n.sink ? "" : `<span class="shapes">${fmtShape(st.output)}</span>${deltaHtml(st)}`;
    const opLabel = st.op === "source" ? "in memory" : st.op;
    return `<div class="tnode ${kind} ${warned}" data-node="${esc(key)}" style="--gutter:${gutter}px; --lane:${LANES[lane % LANES.length]}">
      <span class="gdot" data-n="${st.out_node}" style="left:${14 + lane * 16}px"></span>
      <div class="thead"><span class="label">${esc(l)}</span>${ver}
        <span class="op ${opKind(st.op)}" title="${esc(params)}">${esc(opLabel)}</span>${shape} ${cols}
        <span class="loc">${site.file ? esc(site.file.split(/[\\/]/).pop() + ":" + site.line) : ""}</span></div>
      ${!st.minor && site.comment ? `<div class="why">${esc(site.comment)}</div>` : ""}
      ${!st.minor && site.code ? `<div class="code-line">${esc(site.code)}</div>` : ""}
      ${(st.warnings || []).map((w) => `<div class="warn">⚠ ${esc(w)}</div>`).join("")}
      ${openNodes.has(key) ? previewHtml(st) : ""}
    </div>`;
  }).join("");
  const edges = rows.flatMap((st) => (st.in_nodes || []).filter((p) => pos[p])
    .map((p, i) => ({ from: p, to: st.out_node, secondary: i > 0 })));
  return { html: `<div class="tree" id="tree" data-edges="${esc(JSON.stringify(edges))}"><svg class="edges"></svg>${html}</div>` };
}

function drawEdges() {
  const tree = document.getElementById("tree"); if (!tree) return;
  const svg = tree.querySelector("svg.edges"), box = tree.getBoundingClientRect();
  const at = {};
  tree.querySelectorAll(".gdot").forEach((d) => {
    const r = d.getBoundingClientRect();
    at[d.dataset.n] = { x: r.left + r.width / 2 - box.left, y: r.top + r.height / 2 - box.top,
                        color: getComputedStyle(d).getPropertyValue("--lane") };
  });
  svg.setAttribute("width", box.width); svg.setAttribute("height", box.height);
  svg.innerHTML = JSON.parse(tree.dataset.edges).map((e) => {
    const a = at[e.from], b = at[e.to]; if (!a || !b) return "";
    const d = a.x === b.x ? `M${a.x},${a.y} V${b.y}`
      : `M${a.x},${a.y} V${b.y - 18} C${a.x},${b.y - 6} ${b.x},${b.y - 12} ${b.x},${b.y}`;
    return `<path d="${d}" fill="none" stroke="${b.color}" stroke-width="2" ${e.secondary ? 'stroke-dasharray="4 3"' : ""} opacity=".85"/>`;
  }).join("");
}
new ResizeObserver(() => drawEdges()).observe(document.body);

function renderTrail(trail, runId) {
  if (!trail || !trail.length) return "";
  const loads = trail.filter((s) => s.op.startsWith("read:"));
  const writes = trail.filter((s) => s.op.startsWith("write:"));
  const nw = trail.reduce((n, s) => n + (s.warnings || []).length, 0);
  const io = (s) => `<b>${fmtShape(s.output)}</b> ${esc(Object.values(s.params || {})[0] || "")}`;
  const sum = [
    loads.length ? "in: " + loads.map(io).join(", ") : "",
    writes.length ? "out: " + writes.map(io).join(", ") : "",
    nw ? `<span class="badge-warn">⚠ ${nw} warning${nw > 1 ? "s" : ""}</span>` : "",
  ].filter(Boolean).join(" &nbsp;·&nbsp; ");
  const real = trail.filter((s) => s.op !== "source" && !s.minor).length;
  const hasTree = trail.some((s) => s.out_node != null);
  const body = hasTree ? renderTree(trail, runId).html
    : `<div class="trail">${trail.map(renderStep).join("")}</div>`;  // runs recorded before lineage
  return `<h2>data trail <span class="meta">${real} steps${hasTree ? " · click a node to preview its data" : ""}</span></h2>
    ${sum ? `<div class="trail-sum" style="border:0;padding:0 0 6px">${sum}</div>` : ""}${body}`;
}

// ---- scripts: rendered with @pierre/diffs (bundled in /static/diffs.js; https://diffs.com) ----
let Diffs = null;
const diffsReady = import("/static/diffs.js").then((m) => (Diffs = m)).catch((e) => {
  console.warn("valet: diff renderer unavailable, using plain diffs", e);
});
const pref = (k, d) => { try { return localStorage.getItem("valet." + k) ?? d; } catch { return d; } };
const setPref = (k, v) => { try { localStorage.setItem("valet." + k, v); } catch {} };
let diffStyle = pref("diffStyle", "split"), wrapLines = pref("wrap", "1") === "1";
const narrow = matchMedia("(max-width: 700px)");
const effectiveStyle = () => (narrow.matches ? "unified" : diffStyle);   // split is unreadable on a phone
narrow.addEventListener("change", () => loadDetail(true));
const mounted = new Map();   // key -> { host, inst }: rendered scripts survive output polling

const LANG_BY_EXT = { py: "python", pyw: "python", sql: "sql", sh: "shellscript", bash: "shellscript",
  zsh: "shellscript", json: "json", yaml: "yaml", yml: "yaml", toml: "toml", md: "markdown", r: "r" };
function fileInput(path, contents) {
  const name = path.split(/[\\/]/).pop();
  const lang = LANG_BY_EXT[(name.split(".").pop() || "").toLowerCase()];
  return lang ? { name, contents } : { name, contents, lang: "text" };   // unbundled → plain text
}

function counts(diff) {
  let a = 0, d = 0;
  for (const l of (diff || "").split("\n")) {
    if (l.startsWith("+") && !l.startsWith("+++")) a++;
    else if (l.startsWith("-") && !l.startsWith("---")) d++;
  }
  return { a, d };
}

function viewFor(f, key) {
  const v = fileView[key];
  if (v === "first" && f.first_content != null) return v;
  if (v === "full" || f.prev_content == null) return "full";
  return "prev";
}

function renderFile(f, runId, cwd) {
  const shown = relPath(f.path, cwd);
  const key = runId + f.path;
  const view = viewFor(f, key);
  const tab = (v, label) => `<button class="${view === v ? "" : "ghost"}" data-key="${esc(key)}" data-view="${v}">${label}</button>`;
  const tabs = f.prev_content == null ? "" : `<span class="tabs">${tab("prev", `changes vs #${f.prev_run}`)}${
    f.first_content != null ? tab("first", `vs first #${f.first_run}`) : ""}${tab("full", "full file")}</span>`;
  const shownDiff = view === "first" ? f.first_diff : f.diff;
  const c = counts(shownDiff);
  const countHtml = f.prev_content == null ? `<span class="ver">first version</span>`
    : shownDiff ? `<span class="counts" title="lines added / removed ${view === "first" ? `since run #${f.first_run}` : `since run #${f.prev_run}`}"><span class="a">+${c.a}</span> <span class="d">−${c.d}</span></span>` : "";
  const unchanged = view === "prev" && f.diff === ""
    ? `<div class="unchanged">unchanged since run #${f.prev_run}</div>` : "";
  const mkey = [key, view, effectiveStyle(), wrapLines, Diffs ? "diffs" : "plain"].join("|");
  return `<div class="fhead"><span class="fname" title="${esc(f.path)}">${esc(shown)}</span>
      <span class="ver">v${f.version || 1}</span>${countHtml}${tabs}</div>
    ${unchanged}<div class="filemount" data-mkey="${esc(mkey)}" data-key="${esc(key)}"></div>`;
}


// ---- outputs: frames written or printed, files and images the run produced ----------------
const artCache = new Map();   // key -> element (keeps sort/filter state across polls)
const KIND = { write: "written", print: "printed", file: "file", image: "image", chart: "chart", html: "html", ask: "asked" };
let vegaLib = null;   // loaded only when a run has a chart
const loadVega = () => (vegaLib ||= import("/static/vega.js"));
const MULTI_VIEW = ["facet", "hconcat", "vconcat", "concat", "repeat"];

function drawChart(box, a) {
  loadVega().then(({ embed }) => {
    const spec = JSON.parse(JSON.stringify(a.spec));
    if (!MULTI_VIEW.some((k) => k in spec)) {   // fill the card's width
      spec.width ??= "container"; spec.height ??= 280;
      spec.autosize ??= { type: "fit", contains: "padding" };
    }
    spec.config = { background: "transparent", ...(spec.config || {}) };
    const dark = matchMedia("(prefers-color-scheme: dark)").matches;
    // no "open in Vega Editor": it would send the data to an external site
    return embed(box, spec, { theme: dark ? "dark" : undefined, renderer: "svg",
                              actions: { export: true, source: true, compiled: false, editor: false } });
  }).catch((e) => { box.innerHTML = `<div class="err">couldn't draw this chart: ${esc(e.message || e)}</div>`; });
}
const isNum = (v) => v !== "" && v !== "None" && v !== "null" && !isNaN(Number(String(v).replace(/,/g, "")));

function artKey(r, a) { return [r.id, a.seq, (a.shape || []).join("x"), (a.rows || []).length, a.size, a.rows_used].join(":"); }

function renderOutputs(r) {
  const arts = r.artifacts || [];
  if (!arts.length) return "";
  return `<h2>outputs <span class="meta">${arts.length}</span></h2>` +
    arts.map((a) => `<div class="artslot" data-akey="${esc(artKey(r, a))}"></div>`).join("");
}

function compareHtml(a) {
  const p = a.prev, d = a.diff;
  if (d && d.vs_run != null && d.added != null) {   // row-level: much more than shape
    const bits = [];
    if (d.added) bits.push(`<span class="up">+${d.added.toLocaleString()} added</span>`);
    if (d.removed) bits.push(`<span class="down">−${d.removed.toLocaleString()} removed</span>`);
    if (d.changed) bits.push(`<span>${d.changed.toLocaleString()} changed</span>`);
    (d.cols_added || []).forEach((c) => bits.push(`<span class="up">+${esc(c)}</span>`));
    (d.cols_removed || []).forEach((c) => bits.push(`<span class="down">−${esc(c)}</span>`));
    if (!bits.length) bits.push("no row changes");
    return `<span class="art-cmp">vs run #${d.vs_run}${d.key ? ` (rows matched by ${esc(d.key.join(" + "))})` : ""}: ${bits.join(" · ")}</span>`;
  }
  if (!p) return "";
  const bits = [];
  if (p.shape && a.shape) {
    const dr = a.shape[0] - p.shape[0];
    if (dr) bits.push(`<span class="${dr > 0 ? "up" : "down"}">${dr > 0 ? "+" : "−"}${Math.abs(dr).toLocaleString()} rows</span>`);
    const was = new Set(p.columns || []), now = new Set(a.columns || []);
    const added = (a.columns || []).filter((c) => !was.has(c)), removed = (p.columns || []).filter((c) => !now.has(c));
    if (added.length) bits.push(`<span class="up">+${added.length} col${added.length > 1 ? "s" : ""} (${esc(added.slice(0, 4).join(", "))})</span>`);
    if (removed.length) bits.push(`<span class="down">−${removed.length} col${removed.length > 1 ? "s" : ""} (${esc(removed.slice(0, 4).join(", "))})</span>`);
    if (!bits.length) bits.push("same shape and columns");
  } else if (p.size != null && a.size != null) {
    bits.push(p.size === a.size ? "same size" : `was ${p.size.toLocaleString()} bytes`);
  }
  return `<span class="art-cmp">vs run #${p.run_id}: ${bits.join(" · ")}</span>`;
}


// ---- column profiles (computed over the whole frame by the hook) ----------------------
const compact = (v) => typeof v === "number"
  ? new Intl.NumberFormat(undefined, { notation: Math.abs(v) >= 1e5 ? "compact" : "standard", maximumFractionDigits: 2 }).format(v)
  : String(v);
let showProfiles = pref("profiles", "1") === "1";
function profileHtml(p, n) {
  if (!p || !Object.keys(p).length) return "";
  if (p.hist) {
    const max = Math.max(...p.hist.counts, 1), w = 110, h = 26, bw = w / p.hist.counts.length;
    const bars = p.hist.counts.map((c, i) => `<rect x="${(i * bw + 0.5).toFixed(1)}" y="${(h - (c / max) * h).toFixed(1)}" width="${(bw - 1).toFixed(1)}" height="${((c / max) * h).toFixed(1)}" rx="1" fill="var(--accent)" opacity=".75"><title>${c.toLocaleString()} rows</title></rect>`).join("");
    return `<div class="prof" title="mean ${compact(p.mean)} · median ${compact(p.median)} · ${(p.distinct || 0).toLocaleString()} distinct">
      <svg width="${w}" height="${h}" aria-label="distribution">${bars}</svg>${compact(p.min)} – ${compact(p.max)}</div>`;
  }
  if (p.top) {
    const rows = p.top.slice(0, 3).map(([v, c]) => `<span title="${esc(v)}">${esc(v)}</span><span>${compact(c)}</span>
      <div class="bar" style="width:${Math.max(2, 100 * c / Math.max(1, n))}%"></div>`).join("");
    return `<div class="prof"><div class="topv">${rows}</div>${(p.distinct || 0).toLocaleString()} distinct</div>`;
  }
  if (p.min != null) return `<div class="prof">${esc(p.min)} → ${esc(p.max)}</div>`;
  return p.distinct != null ? `<div class="prof">${p.distinct.toLocaleString()} distinct</div>` : "";
}

function rowDiffHtml(d) {
  if (!d || d.vs_run == null || d.added == null || !(d.added || d.removed || d.changed)) {
    return d && d.skipped ? `<div class="rowdiff">row changes not tracked: ${esc(d.skipped)}</div>` : "";
  }
  const s = d.samples || {}, cols = d.columns || [], ocols = d.old_columns || cols;
  const keyN = (d.key || []).length;
  const vals = (row, names) => row.slice(keyN, keyN + 8).map((v, i) => `${esc(names[keyN + i])}=${esc(v)}`).join("  ");
  const keyTxt = (x) => esc((x.key || x.row.slice(0, 2)).join(" / "));
  const rows = [
    ...(s.changed || []).map((x) => `<tr><td class="k-changed">changed</td><td>${keyTxt(x)}</td><td>${
      x.cells.map(([c, o, n]) => `${esc(c)}: <span class="old">${esc(o) || "∅"}</span> → <span class="new">${esc(n) || "∅"}</span>`).join(" · ")}</td></tr>`),
    ...(s.added || []).map((x) => `<tr><td class="k-added">added</td><td>${keyTxt(x)}</td><td>${vals(x.row, cols)}</td></tr>`),
    ...(s.removed || []).map((x) => `<tr><td class="k-removed">removed</td><td>${keyTxt(x)}</td><td>${vals(x.row, ocols)}</td></tr>`),
  ];
  const shownN = rows.length, total = (d.added || 0) + (d.removed || 0) + (d.changed || 0);
  const chips = Object.entries(d.col_changes || {}).map(([c, n]) => `<span class="chip2">${esc(c)} ×${n.toLocaleString()}</span>`).join("");
  return `<details class="rowdiff" ${total <= 200 ? "open" : ""}><summary>row changes vs run #${d.vs_run}${
      shownN < total ? ` (showing ${shownN} of ${total.toLocaleString()})` : ""}</summary>
    ${chips ? `<div class="chips"><span class="meta" style="margin:0">changed columns:</span>${chips}</div>` : ""}
    ${d.note ? `<div class="meta">${esc(d.note)}</div>` : ""}
    <div class="scroll"><table>${rows.join("")}</table></div></details>`;
}

function buildArtifact(a, r) {
  const el = document.createElement("div");
  el.className = "art";
  const site = a.site || {};
  const loc = site.file ? `${site.file.split(/[\\/]/).pop()}:${site.line}` : "";
  const name = a.title || (a.path ? relPath(a.path, r.cwd) : `printed at ${loc}`);
  const shape = a.shape ? `${a.rows_estimated ? "≈" : ""}${a.shape[0].toLocaleString()} rows × ${a.shape[1]} cols` : "";
  const size = a.size != null && !a.shape ? `<span class="art-meta">${(a.size / 1024).toFixed(a.size < 10240 ? 1 : 0)} KB</span>` : "";
  const used = a.type === "chart" ? `<span class="art-meta">${a.aggregated
      ? `${(a.rows_used || 0).toLocaleString()} groups from ${(a.rows_total || 0).toLocaleString()} rows` : a.rows_total > a.rows_used
      ? `first ${a.rows_used.toLocaleString()} of ${a.rows_total.toLocaleString()} rows` : `${(a.rows_used || 0).toLocaleString()} rows`}</span>` : "";
  const fileUrl = `/api/runs/${r.id}/artifacts/${a.seq}/file`;
  el.innerHTML = `<div class="art-head"><span class="art-kind">${KIND[a.type] || a.type}</span>
      <span class="art-name" title="${esc(a.path || "")}">${esc(name)}</span>
      ${shape ? `<span class="art-shape">${shape}</span>` : ""}${size}${used}
      ${a.type === "html" ? `<a href="${fileUrl}" target="_blank" rel="noopener">open in a new tab</a>` : ""}
      ${a.lib ? `<span class="art-meta">${esc(a.lib)}</span>` : ""}${compareHtml(a)}
      ${(a.type === "write" || a.type === "chart" || a.type === "ask" || a.title) && loc ? `<span class="loc">${esc(loc)}</span>` : ""}</div>`;
  if (a.error) { el.insertAdjacentHTML("beforeend", `<div class="err">couldn't preview: ${esc(a.error)}</div>`); return el; }
  if (a.type === "ask") {
    el.insertAdjacentHTML("beforeend", `<div class="answer">${a.answered_by === "user"
      ? `you answered <b>${esc(a.answer)}</b> after ${a.waited}s`
      : `${esc(a.answered_by)}, so the script used the default <b>${esc(a.answer ?? "None")}</b>`}${
      a.options ? ` <span class="meta">(options: ${a.options.map(esc).join(", ")})</span>` : ""}</div>`);
    return el;
  }
  if (a.type === "chart") {
    const box = document.createElement("div"); box.className = "chartbox";
    el.append(box); drawChart(box, a); return el;
  }
  if (a.type === "html") {   // sandboxed: its scripts run in an opaque origin, away from the viewer
    el.insertAdjacentHTML("beforeend", `<iframe sandbox="allow-scripts" loading="lazy" src="${fileUrl}" title="${esc(name)}"></iframe>`);
    return el;
  }
  if (a.type === "image") {
    el.insertAdjacentHTML("beforeend", `<img loading="lazy" alt="${esc(name)}" src="/api/runs/${r.id}/artifacts/${a.seq}/file">`);
    return el;
  }
  if (!a.columns) return el;   // e.g. a parquet file written some other way: listed, no preview
  const rd = rowDiffHtml(a.diff);
  if (rd) el.insertAdjacentHTML("beforeend", rd);

  const rows = a.rows || [];
  const state = { sort: null, dir: 1, q: "" };
  const shown = rows.length < (a.shape ? a.shape[0] : 0)
    ? `first ${rows.length.toLocaleString()} of ${a.rows_estimated ? "≈" : ""}${a.shape[0].toLocaleString()} rows` : `${rows.length.toLocaleString()} rows`;
  // numeric = right-aligned and sorted as numbers. Trust the dtype when we have one: a String
  // column of codes like "010" must stay text (leading zeros, text sort).
  const numCol = a.columns.map((_, i) => {
    const dt = (a.dtypes || [])[i];
    if (dt) return /^(u?int|float|decimal|double|number)/i.test(dt);
    return rows.length > 0 && rows.every((r) => r[i] === "" || r[i] === "None" || r[i] === "null" || isNum(r[i]));
  });
  el.insertAdjacentHTML("beforeend", `<div class="art-tools">
      <input type="search" placeholder="filter rows…" aria-label="filter rows">
      ${a.profile ? `<label title="computed over ${a.profile_sampled ? "a 1M-row sample" : "all rows"}"><input type="checkbox" class="profchk" ${showProfiles ? "checked" : ""}> column summaries${a.profile_sampled ? " (sampled)" : ""}</label>` : ""}
      <span class="meta count">${shown}${a.more_columns ? ` · +${a.more_columns} more columns` : ""}</span></div>
    <div class="grid"><table><thead><tr><th class="rn">#</th>${a.columns.map((c, i) => {
      const nulls = a.nulls ? a.nulls[i] : null, n = a.shape ? a.shape[0] : rows.length;
      const pct = nulls != null && n ? 100 * nulls / n : 0;
      return `<th data-col="${i}" title="sort by ${esc(c)}">${esc(c)} <span class="dtype">${esc((a.dtypes || [])[i] || "")}</span>${
        nulls == null ? "" : `<div class="nulltxt">${nulls ? pct.toFixed(1) + "% missing" : "no missing"}</div><div class="nullbar"><i style="width:${Math.min(100, pct)}%"></i></div>`}${
        a.profile ? profileHtml(a.profile[i], n - (nulls || 0)) : ""}</th>`;
    }).join("")}</tr></thead><tbody></tbody></table></div>`);
  const tbody = el.querySelector(".grid tbody"), count = el.querySelector(".count");
  const draw = () => {
    let list = rows.map((r, i) => [i, r]);
    if (state.q) { const q = state.q.toLowerCase(); list = list.filter(([, r]) => r.some((v) => String(v).toLowerCase().includes(q))); }
    if (state.sort !== null) {
      const c = state.sort, num = numCol[c];
      list.sort(([, x], [, y]) => state.dir * (num ? (Number(String(x[c]).replace(/,/g, "")) || 0) - (Number(String(y[c]).replace(/,/g, "")) || 0)
                                               : String(x[c]).localeCompare(String(y[c]))));
    }
    tbody.innerHTML = list.map(([i, r]) => `<tr><td class="rn">${i + 1}</td>${r.map((v, c) =>
      `<td class="${numCol[c] ? "num" : ""}">${esc(v)}</td>`).join("")}</tr>`).join("");
    count.textContent = (state.q ? `${list.length} matching · ` : "") + shown +
      (state.sort !== null ? ` · sorted by ${a.columns[state.sort]} ${state.dir > 0 ? "↑" : "↓"} (preview rows only)` : "") +
      (a.more_columns ? ` · +${a.more_columns} more columns` : "");
  };
  el.querySelector(".grid thead").addEventListener("click", (e) => {
    const th = e.target.closest("th[data-col]"); if (!th) return;
    const c = +th.dataset.col;
    state.dir = state.sort === c ? -state.dir : 1; state.sort = c; draw();
  });
  el.querySelector("input[type=search]").addEventListener("input", (e) => { state.q = e.target.value; draw(); });
  el.classList.toggle("noprof", !showProfiles);
  const chk = el.querySelector(".profchk");
  if (chk) chk.addEventListener("change", (e) => {   // applies to every table, remembered per browser
    showProfiles = e.target.checked; setPref("profiles", showProfiles ? "1" : "0");
    document.querySelectorAll(".art").forEach((x) => x.classList.toggle("noprof", !showProfiles));
    document.querySelectorAll(".profchk").forEach((x) => { x.checked = showProfiles; });
  });
  draw();
  return el;
}

function mountOutputs(r) {
  const used = new Set();
  document.querySelectorAll(".artslot").forEach((slot) => {
    const k = slot.dataset.akey; used.add(k);
    let el = artCache.get(k);
    if (!el) {
      const a = (r.artifacts || []).find((x) => artKey(r, x) === k);
      el = buildArtifact(a, r);
      artCache.set(k, el);
    }
    slot.replaceWith(el);
  });
  for (const k of artCache.keys()) if (!used.has(k)) artCache.delete(k);
}


// ---- errors: the traceback of a failed run, with the failing line in context -----------
function sameFile(a, b) {
  const n = (p) => p.replace(/\\/g, "/").replace(/^\.\//, "");
  const A = n(a), B = n(b), win = /^[a-z]:\//i.test(A) || /^[a-z]:\//i.test(B);
  return win ? A.toLowerCase() === B.toLowerCase() : A === B;
}
function renderError(r) {
  const e = r.error;
  if (!e) return "";
  const [first, ...more] = (e.message || "").split("\n");
  const fr = e.user_frame != null ? e.frames[e.user_frame] : e.frames[e.frames.length - 1];
  let ctx = "";
  if (fr) {
    const snap = (r.files || []).find((f) => sameFile(f.path, fr.file) || sameFile(f.path, (r.cwd || "") + "/" + fr.file));
    if (snap) {   // the recorded version of the script, so this matches what actually ran
      const lines = snap.content.split("\n"), from = Math.max(1, fr.line - 3), to = Math.min(lines.length, fr.line + 2);
      ctx = `<pre class="ectx">${lines.slice(from - 1, to).map((t, i) => {
        const n = from + i; return `<span class="${n === fr.line ? "hit" : ""}"><span class="ln">${n}</span>${esc(t) || " "}</span>`;
      }).join("")}</pre>`;
    } else if (fr.code) {
      ctx = `<pre class="ectx"><span class="hit"><span class="ln">${fr.line}</span>${esc(fr.code)}</span></pre>`;
    }
  }
  const where = fr ? `in <b>${esc(relPath(fr.file, r.cwd))}:${fr.line}</b>${fr.func && fr.func !== "<module>" ? ` (${esc(fr.func)})` : ""}${
    e.user_frame != null && e.user_frame < e.frames.length - 1 ? ` · raised inside ${esc(e.frames[e.frames.length - 1].file.split(/[\\/]/).slice(-2).join("/"))}` : ""}` : "";
  return `<div class="errcard">
    <div><span class="etype">${esc(e.type)}</span></div>
    <div class="emsg">${esc(first)}${more.length ? "\n" + esc(more.slice(0, 6).join("\n")) + (more.length > 6 ? "\n…" : "") : ""}</div>
    ${where ? `<div class="eloc">${where}</div>` : ""}${ctx}
    ${e.hint ? `<div class="hint">💡 ${esc(e.hint)}</div>` : ""}
    <details><summary>full traceback</summary><pre>${esc(e.traceback || "")}</pre></details></div>`;
}

// ---- questions from running scripts (valet_view.ask) -----------------------------------
const askEls = new Map();   // id -> element; kept across polls so typing isn't interrupted
const baseTitle = document.title;
function renderAsks(asks, runs) {
  const box = $("#asks"), live = new Set(asks.map((q) => q.id));
  for (const [id, el] of askEls) if (!live.has(id)) { el.remove(); askEls.delete(id); }
  for (const q of asks) {
    let el = askEls.get(q.id);
    if (!el) {
      el = document.createElement("div"); el.className = "ask"; el.dataset.id = q.id;
      const run = runs.find((r) => String(r.id) === String(q.run_id));
      const where = q.site && q.site.file ? `${q.site.file.split(/[\\/]/).pop()}:${q.site.line}` : "";
      el.innerHTML = `<div class="q">${esc(q.question)}<small>run #${esc(q.run_id)}${run && run.title ? " · " + esc(run.title) : ""}${
          where ? " · " + esc(where) : ""} is waiting for your answer</small></div>
        <div class="choices">${q.options
          ? q.options.map((o) => `<button class="${o === q.default ? "def" : ""}" data-answer="${esc(o)}">${esc(o)}</button>`).join("")
          : `<input type="text" placeholder="type your answer…" aria-label="answer"><button data-send>Send</button>`}</div>
        <span class="left"></span>`;
      el.addEventListener("click", (e) => {
        const b = e.target.closest("button"); if (!b) return;
        sendAnswer(q.id, b.dataset.answer != null ? b.dataset.answer : el.querySelector("input").value);
      });
      const inp = el.querySelector("input");
      if (inp) inp.addEventListener("keydown", (e) => { if (e.key === "Enter") sendAnswer(q.id, inp.value); });
      box.append(el); askEls.set(q.id, el);
    }
    el.querySelector(".left").textContent = `${Math.ceil(q.remaining)}s left, then "${q.default ?? "no answer"}"`;
  }
  document.title = asks.length ? `(${asks.length}) question · ${baseTitle}` : baseTitle;
}
async function sendAnswer(id, answer) {
  if (answer == null || !String(answer).trim()) return;
  const r = await fetch("/api/asks/answer", { method: "POST", headers: { "X-Valet": "1" },
                                               body: JSON.stringify({ id, answer: String(answer).trim() }) });
  if (r.ok) { const el = askEls.get(id); if (el) { el.remove(); askEls.delete(id); } document.title = baseTitle; }
}

function renderFileBar(files) {
  if (!files.length) return "";
  const b = (v, label) => `<button class="${diffStyle === v ? "on" : ""}" data-style="${v}">${label}</button>`;
  const seg = narrow.matches ? "" : `<span class="seg">${b("split", "Split")}${b("unified", "Unified")}</span>`;
  return `<div class="filebar">${seg}
    <label><input type="checkbox" id="wrap" ${wrapLines ? "checked" : ""}> wrap lines</label></div>`;
}

function mountFiles(run) {
  const used = new Set();
  document.querySelectorAll(".filemount").forEach((slot) => {
    const mkey = slot.dataset.mkey;
    used.add(mkey);
    const cached = mounted.get(mkey);
    if (cached) { slot.replaceWith(cached.host); return; }
    const f = run.files.find((x) => run.id + x.path === slot.dataset.key);
    const view = viewFor(f, slot.dataset.key);
    const old = view === "prev" ? f.prev_content : view === "first" ? f.first_content : null;
    const host = document.createElement("div");
    host.className = "filemount";
    host.dataset.mkey = mkey;
    let inst = null;
    if (Diffs) {
      const opts = { themeType: "system", overflow: wrapLines ? "wrap" : "scroll", diffStyle: effectiveStyle(),
                     disableFileHeader: true, hunkSeparators: "line-info", lineDiffType: "word-alt" };
      try {
        if (old != null && old !== f.content) {
          inst = new Diffs.FileDiff(opts);
          inst.render({ oldFile: fileInput(f.path, old), newFile: fileInput(f.path, f.content), containerWrapper: host });
        } else {
          inst = new Diffs.File(opts);
          inst.render({ file: fileInput(f.path, f.content), containerWrapper: host });
        }
      } catch (e) { console.warn("valet: diff render failed", e); inst = null; host.innerHTML = ""; }
    }
    if (!inst) {  // fallback: plain unified diff / file
      host.innerHTML = view !== "full" && f.diff && view === "prev"
        ? `<pre class="code" style="border:0">${renderDiff(f.diff)}</pre>`
        : `<pre class="code" style="border:0">${esc(f.content)}</pre>`;
    }
    slot.replaceWith(host);
    mounted.set(mkey, { host, inst });
  });
  for (const [k, m] of mounted) {   // free scripts no longer on screen
    if (!used.has(k)) { try { m.inst && m.inst.cleanUp(); } catch {} mounted.delete(k); }
  }
}

async function loadDetail(force) {
  if (selected === null) return;
  const r = await (await fetch(`/api/runs/${selected}`)).json();
  if (!r || r.id == null) return;   // an API error ({"error": ...}); runs have an "error" field of their own
  const key = JSON.stringify([r.id, r.exit_code, r.output.length, (r.trail || []).length, fileView, [...openNodes],
                             (r.artifacts || []).map((a) => a.seq + ":" + (a.shape || []).join("x")).join(","),
                             diffStyle, wrapLines, !!Diffs]);
  if (!force && key === lastDetailKey) return;
  lastDetailKey = key;
  const outEl = document.getElementById("out");
  const atBottom = outEl && outEl.scrollTop + outEl.clientHeight >= outEl.scrollHeight - 20;
  const st = status(r);
  $("#detail").innerHTML = `
    ${r.title ? `<div class="run-title">${esc(r.title)}</div>` : ""}
    <div class="meta"><span class="dot ${st}"></span>run #${r.id} · ${ago(r.started)} ·
      ${r.exit_code === null ? "running…" : "exit " + r.exit_code} ${r.duration != null ? "· " + r.duration.toFixed(1) + "s" : ""} · ${esc(r.cwd)}</div>
    <div class="cmdline">$ ${esc(r.argv.join(" "))}</div>
    ${renderError(r)}
    ${renderFileBar(r.files)}${r.files.map((f) => renderFile(f, r.id, r.cwd)).join("")}
    ${renderOutputs(r)}
    ${renderTrail(r.trail, r.id)}
    <h2>output ${r.truncated ? '<span class="meta">(truncated)</span>' : ""}</h2>
    <pre class="code" id="out">${esc(r.output) || '<span class="meta">(no output)</span>'}</pre>
    ${r.notes.map((n) => `<div class="note-delivered"><b>delivered to agent:</b> ${esc(n.text)}</div>`).join("")}`;
  mountFiles(r);
  mountOutputs(r);
  drawEdges();
  const o = document.getElementById("out");
  if (atBottom || r.exit_code === null) o.scrollTop = o.scrollHeight;
}

async function tick() {
  try {
    const { runs, pending, asks } = await (await fetch("/api/runs")).json();
    if (runs.length && (selected === null || $("#follow").checked)) selected = runs[0].id;
    $("#runs").innerHTML = runs.map((r) => `
      <div class="run ${r.id === selected ? "sel" : ""}" data-id="${r.id}">
        <div class="top"><span><span class="dot ${status(r)}"></span>#${r.id}${r.trail_warnings ? `<span class="badge-warn">⚠ ${r.trail_warnings}</span>` : ""}${
          r.n_artifacts ? `<span class="badge-out" title="outputs">▦ ${r.n_artifacts}</span>` : ""}${
          r.error_type ? `<span class="etag">${esc(r.error_type)}</span>` : ""}</span><span>${ago(r.started)}</span></div>
        ${r.title ? `<div class="title" title="${esc(r.title)}">${esc(r.title)}</div>` : ""}
        <div class="cmd" title="${esc(r.argv.join(" "))}">${esc(shortCmd(r.argv, r.cwd))}</div>
      </div>`).join("");
    renderAsks(asks || [], runs);
    $("#pending").innerHTML = pending.map((n) =>
      `<span class="chip">queued: ${esc(n.text)}<b data-del="${n.id}" title="withdraw">×</b></span>`).join("");
    await loadDetail(false);
    $("#conn").textContent = "";
  } catch (e) {
    $("#conn").textContent = "viewer stopped: run valet ui to restart";
  }
}

$("#runs").addEventListener("click", (e) => {
  const el = e.target.closest(".run"); if (!el) return;
  selected = +el.dataset.id; $("#follow").checked = false; tick();
});
$("#detail").addEventListener("click", (e) => {
  const t = e.target.closest(".tnode");
  if (t && !e.target.closest(".preview")) {
    const k = t.dataset.node;
    openNodes.has(k) ? openNodes.delete(k) : openNodes.add(k);
    loadDetail(true); return;
  }
  const st = e.target.closest("button[data-style]");
  if (st) { diffStyle = st.dataset.style; setPref("diffStyle", diffStyle); loadDetail(true); return; }
  const b = e.target.closest("button[data-view]"); if (!b) return;
  fileView[b.dataset.key] = b.dataset.view; loadDetail(true);
});
$("#detail").addEventListener("change", (e) => {
  if (e.target.id === "wrap") { wrapLines = e.target.checked; setPref("wrap", wrapLines ? "1" : "0"); loadDetail(true); }
});
$("#pending").addEventListener("click", async (e) => {
  const id = e.target.dataset.del; if (!id) return;
  await fetch("/api/notes/delete", { method: "POST", headers: { "X-Valet": "1" }, body: JSON.stringify({ id: +id }) }); tick();
});
$("#note-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = $("#note").value.trim(); if (!text) return;
  await fetch("/api/notes", { method: "POST", headers: { "X-Valet": "1" }, body: JSON.stringify({ text }) });
  $("#note").value = ""; tick();
});
diffsReady.finally(() => loadDetail(true));
tick(); setInterval(tick, 1500);
</script>
</body>
