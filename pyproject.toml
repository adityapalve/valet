[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "valet"
version = "0.10.0"
description = "Make your coding agent's scratch scripts and terminal runs durable, visible and steerable"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
valet = "valet.cli:main"

[tool.setuptools]
packages = ["valet"]

[tool.setuptools.package-data]
valet = ["viewer.html", "hook/*.py", "static/*"]
